# Runs the same checks the PR template asks you to paste output for, so a PR that
# self-reports green but isn't gets caught here instead of at integration time.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # logic/ runs node:test over TypeScript directly, no runner dependency. Needs
      # a Node with type stripping on by default, which is why this is not pinned to 22.
      - name: Test
        run: npm test --workspaces --if-present
