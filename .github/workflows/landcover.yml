# Offline ESA WorldCover clip-and-export job.
#
# Manual only, and deliberately so: this is the heavy GIS work that docs/MASTER.md §4
# keeps out of the live request path. The masks it produces change once a year at
# most, because the source dataset is the 2021 WorldCover release.
name: landcover

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Regions to build, space separated. One region is enough for a test run.'
        required: false
        default: 'punjab bihar delhi telangana'
      publish:
        description: 'Commit the masks to frontend/public/landcover/ so the live app serves them.'
        type: boolean
        required: false
        default: false

jobs:
  build-masks:
    runs-on: ubuntu-latest

    # Only needed for the publish step. The default read-only token is enough to
    # build and upload the artifact.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-gdal
          gdalinfo --version

      - name: Clip WorldCover to the v1 regions
        run: ./pipeline/landcover.sh ${{ inputs.regions }}

      # The check the task was written around: a point known to sit in Punjab
      # cropland has to resolve to cropland against the output. Everything upstream
      # of this can be subtly wrong — a missing tile, a bad bbox, a class code typo —
      # and still produce a plausible-looking file, so the pipeline asserts on a
      # known answer rather than on "it ran".
      #
      # 75.60E 30.70N is farmland between Ludhiana and Jagraon.
      - name: Verify a known Punjab cropland point
        if: contains(inputs.regions, 'punjab')
        run: |
          set -euo pipefail
          hits=$(ogr2ogr -f CSV /vsistdout/ \
            -spat 75.599 30.699 75.601 30.701 \
            -select landCover \
            pipeline/tmp/punjab-features.geojson | tail -n +2)

          echo "landCover at 75.60E 30.70N: ${hits:-<no features>}"

          if ! grep -qx cropland <<<"$hits"; then
            echo "FAIL: expected cropland at a known Punjab farmland point" >&2
            exit 1
          fi
          echo "PASS: known Punjab cropland point resolves to cropland"

      - name: Summarise the masks
        run: |
          set -euo pipefail
          for f in pipeline/out/*.json; do
            printf '%s  %s  %s features\n' \
              "$(du -h "$f" | cut -f1)" "$f" "$(jq '.features.features | length' "$f")"
          done

      - name: Upload masks
        uses: actions/upload-artifact@v4
        with:
          name: landcover-masks
          path: pipeline/out/

      # The masks are static assets served by the frontend. Vite copies public/
      # through untouched and does not bundle it, so the app fetches only the region
      # the user selected rather than shipping all four in the JS.
      #
      # Off by default. Turning it on makes this workflow push to whichever branch it
      # was run from, which will need a bypass or a PR once main is protected.
      - name: Publish to frontend/public/landcover/
        if: inputs.publish
        run: |
          set -euo pipefail
          mkdir -p frontend/public/landcover
          cp pipeline/out/*.json frontend/public/landcover/

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Stage before comparing. git diff does not look at untracked files, so on
          # the first publish — when nothing under this path is tracked yet — an
          # unstaged check reports no change and silently skips the commit.
          git add -- frontend/public/landcover
          if git diff --cached --quiet -- frontend/public/landcover; then
            echo "masks unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Publish land-cover masks for ${{ inputs.regions }}" \
                     -m "Generated by the landcover workflow from ESA WorldCover v200 (2021), CC-BY 4.0. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push
