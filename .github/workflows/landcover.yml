# Offline ESA WorldCover job for the whole of India.
#
# Manual only, and deliberately so: this is the heavy GIS work that docs/MASTER.md §4
# keeps out of the live request path. The output changes once a year at most, because
# the source dataset is the 2021 WorldCover release.
#
# pipeline/landcover_india.py reads WorldCover overviews straight off the public S3
# bucket and writes frontend/public/landcover/india.bin (the classifier's 2-bit grid)
# and farmland.png (the map's farmland layer). It asserts known answers itself
# (Ludhiana-Jagraon cropland, Srisailam and Similipal forest, Lahore and the Bay of
# Bengal other), so a missing tile or a class typo fails the run instead of publishing.
name: landcover

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commit the grid and image to frontend/public/landcover/ so the live app serves them.'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Only needed for the publish step.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install rasterio numpy

      - name: National land cover from WorldCover
        run: python -u pipeline/landcover_india.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: landcover-india
          path: |
            frontend/public/landcover/india.bin
            frontend/public/landcover/farmland.png

      # Off by default. Turning it on pushes to whichever branch it was run from, which
      # needs a PR once main is protected.
      - name: Publish to frontend/public/landcover/
        if: inputs.publish
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- frontend/public/landcover
          if git diff --cached --quiet -- frontend/public/landcover; then
            echo "land cover unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Publish national land cover" \
                     -m "Generated by the landcover workflow from ESA WorldCover v200 (2021), CC-BY 4.0. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push
