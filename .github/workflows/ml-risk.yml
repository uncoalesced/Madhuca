# Offline fire-risk model: download the FIRMS archive, train, evaluate, export a RiskGrid.
#
# Manual only (docs/MASTER.md, 2026-09-28 ML decision): never scheduled, never on the
# request path. Needs the FIRMS_MAP_KEY repository secret (Settings -> Secrets and
# variables -> Actions). The download shares that key's 5000 transactions / 10 min
# with the live site; ml/fetch_firms.py runs two requests at a time to stay well under.
name: ml-risk

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to model. Telangana / AP is the priority (issue #21).'
        required: false
        default: 'telangana'
      forecast_date:
        description: 'First day of the 14-day forecast (YYYY-MM-DD). FIRMS data is fetched up to the day before.'
        required: true
      publish:
        description: 'Commit the grid to frontend/public/risk/ so the live app serves it.'
        type: boolean
        required: false
        default: false

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci
      - run: pip install -r ml/requirements.txt

      - name: Per-cell land cover and India mask (the app's own classifier)
        run: node ml/export_cells.ts ${{ inputs.region }}

      - name: Download FIRMS VIIRS archive
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          end=$(date -u -d "${{ inputs.forecast_date }} - 1 day" +%F)
          python -u ml/fetch_firms.py ${{ inputs.region }} 2019-01-01 "$end"

      # Prints held-out metrics next to two baselines; fails if the grid breaks the 50 KB cap.
      - name: Train, evaluate, export
        run: |
          python -u ml/train_risk.py ${{ inputs.region }} ${{ inputs.forecast_date }}
          size=$(stat -c %s ml/out/${{ inputs.region }}.json)
          echo "grid is $size bytes"
          test "$size" -lt 51200

      - uses: actions/upload-artifact@v4
        with:
          name: ml-risk-${{ inputs.region }}
          path: ml/out/

      - name: Publish to frontend/public/risk/
        if: inputs.publish
        run: |
          set -euo pipefail
          mkdir -p frontend/public/risk
          cp ml/out/${{ inputs.region }}.json frontend/public/risk/
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- frontend/public/risk
          if git diff --cached --quiet -- frontend/public/risk; then
            echo "grid unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Publish fire-risk grid for ${{ inputs.region }} from ${{ inputs.forecast_date }}" \
                     -m "Generated by the ml-risk workflow from NASA FIRMS VIIRS and ESA WorldCover. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push
