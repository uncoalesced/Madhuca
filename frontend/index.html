    <style>
      /* Loading screen: the logo drawn as outlines, each mark filling with its own colour in
         turn (~1.2s), then main.tsx fades it out once the app has rendered. Inline so it shows
         before any JavaScript arrives. Colours are the logo's own (assets/logo/). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdfffc;
        transition: opacity 0.35s ease;
      }
      #splash.splash-done {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-logo {
        width: min(52vw, 240px);
        height: auto;
      }
      #splash .s {
        fill-opacity: 0;
        stroke-width: 1.5px;
        vector-effect: non-scaling-stroke;
        animation: splash-fill 0.32s ease-out forwards;
        animation-delay: calc(var(--i) * 32ms);
      }
      @keyframes splash-fill {
        to {
          fill-opacity: 1;
          stroke-opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .s {
          animation: none;
          fill-opacity: 1;
          stroke-opacity: 0;
        }
        #splash {
          transition: none;
        }
      }
    </style>
